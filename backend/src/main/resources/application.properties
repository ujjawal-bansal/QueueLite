spring.application.name=queuelite-api

# Local development reads backend/.env, the same file the Node API used.
# On Render the values come from the service's environment instead.
spring.config.import=optional:file:${QUEUELITE_ENV_FILE:.env}[.properties]

server.port=${PORT:3001}
# Render terminates TLS upstream. Trusting its forwarded headers is what makes
# the client address (for rate limits) and https scheme (for cookies) correct.
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.tomcat.max-swallow-size=100KB
server.max-http-request-header-size=16KB
server.error.whitelabel.enabled=false

spring.threads.virtual.enabled=true
spring.main.banner-mode=off

# The API speaks snake_case JSON, exactly as the Node version did, so the React
# frontend needs no changes.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

spring.sql.init.mode=never
spring.mvc.throw-exception-if-no-handler-found=true
spring.jackson.generator.write-bigdecimal-as-plain=true
