services:
  - type: web
    name: queuelite-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render provides PORT; the app reads it automatically.
      - key: FRONTEND_URL
        sync: false        # https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false        # optional: Vercel preview URLs, comma separated
      - key: CLINIC_SLUG
        value: dev-eye-care
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_PASSCODE_HASH
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: STAFF_RECOVERY_CODE_HASH
        sync: false        # optional: `npm run generate-recovery`
      - key: REMINDER_LEAD_PATIENTS
        value: "3"
      - key: AVG_CONSULT_MINUTES
        value: "15"
      - key: USE_MEASURED_PACE
        value: "false"
      - key: NOTIFIER
        value: whatsapp
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # Set to whatever Meta actually approved - the names differ per account,
      # and a hardcoded value here would overwrite a working one on redeploy.
      - key: WHATSAPP_TEMPLATE_TOKEN_ISSUED
        sync: false
      - key: WHATSAPP_TEMPLATE_YOUR_TURN
        sync: false
      - key: WHATSAPP_TEMPLATE_HEADS_UP
        sync: false        # leave unset until the heads-up template is approved
      - key: WHATSAPP_COUNTRY_CODE
        value: "91"
